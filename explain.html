
<!DOCTYPE html>
<html>
<head>
    <title>LearnMate AI - Explain</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff0f5;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 15px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 4px 15px #e8c5d2;
        }

        h1 { color: #d66b96; }
        h2 { color: #75445a; }
        p { color: #777; }

        textarea {
            width: 90%;
            height: 150px;
            padding: 12px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #e8c5d2;
            font-family: Arial;
        }

        button {
            background: #e88caf;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover { background: #d66b96; }
        a { color: #d66b96; text-decoration: none; }
    </style>
</head>

<body>
    <div class="container">

        <h1>LearnMate AI</h1>
        <h2>Explain Anything</h2>

        <p>Enter a topic you want to understand.</p>

        <form action="/explain" method="POST">
            <textarea name="content" placeholder="Enter your topic here..." required></textarea>
            <br>
            <button type="submit">Explain Topic</button>
        </form>

        {% if result %}
            <h2>Result:</h2>
            <p>{{ result }}</p>
        {% endif %}

        <p><a href="/">Back to Home</a></p>

    </div>
</body>
</html>
